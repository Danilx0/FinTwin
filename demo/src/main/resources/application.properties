spring.application.name=FinTwin

# O Render (e outros servidores) informa a porta pela variavel PORT; localmente fica 8080.
server.port=${PORT:8080}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/fintwin}
spring.datasource.username=${DB_USER:fintwin_app}
spring.datasource.password=${DB_PASSWORD}

# Segredo que assina os tokens de login (JWT). Obrigatorio, com pelo menos 64 caracteres.
fintwin.jwt.secret=${JWT_SECRET}

spring.jpa.hibernate.ddl-auto=validate

spring.jpa.show-sql=false
spring.jpa.open-in-view=false

spring.thymeleaf.cache=false

management.endpoints.web.exposure.include=health,info

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
