spring.application.name=FinTwin

spring.datasource.url=jdbc:h2:mem:fintwin_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Os testes rodam num H2 em memoria; o Hibernate cria as tabelas a partir das entidades.
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

# Envio da foto de perfil (UC05)
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
